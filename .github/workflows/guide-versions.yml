name: Guide versions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  guide-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test guide tooling
        run: python3 -m unittest discover -s tests -v
      - name: Check version bumps
        env:
          GUIDE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GUIDE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/guides.py --base "$GUIDE_BASE_SHA" --head "$GUIDE_HEAD_SHA" --github
